name: hops_and_honey_3d
description: "Full 3D Flutter port of Hops & Honey powered by flutter_scene."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0-110.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_scene: 0.20.0
  shared_preferences: ^2.5.5
  vector_math: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ui/
